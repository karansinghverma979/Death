name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Least Privilege Invariant
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Pinned to immutable commit SHA (actions/checkout@v4.2.2)
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to immutable commit SHA (actions/setup-dotnet@v4.1.0)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7b07e2d477b5226e60ec66e04d0f325 # v4.1.0
        with:
          dotnet-version: '9.0.x'

      - name: Build Death Engine (Release)
        run: dotnet build -c Release